name: Tiny Linux with Toybox (guaranteed to work)

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Install tools (including mtools fix)
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libelf-dev libssl-dev \
            wget xz-utils cpio gzip xorriso mtools grub-pc-bin

      - name: Build maxed-out kernel
        run: |
          make defconfig
          yes "" | make oldconfig
          make -j$(nproc) bzImage modules
          echo "KERNEL=$(make kernelrelease)" >> $GITHUB_ENV

      - name: Download and build static Toybox
        run: |
          wget https://landley.net/toybox/downloads/toybox-0.8.11.tar.gz
          tar xf toybox-0.8.11.tar.gz
          cd toybox-0.8.11
          make defconfig
          sed -i 's/# TOYBOX_STATIC.*/TOYBOX_STATIC=y/' .config
          make -j$(nproc)
          make install PREFIX=../rootfs

      - name: Create root filesystem
        run: |
          mkdir -p rootfs/{dev,proc,sys,tmp}
          sudo mknod rootfs/dev/console c 5 1
          sudo mknod rootfs/dev/null    c 1 3
          sudo mknod rootfs/dev/random  c 1 8
          sudo mknod rootfs/dev/urandom c 1 9

          cat > rootfs/init <<'EOF'
          #!/bin/toybox sh
          mount -t proc     none /proc
          mount -t sysfs    none /sys
          mount -t devtmpfs none /dev

          echo "Toybox Linux Live — ${{ env.KERNEL }}"
          echo "All drivers • Full ELF • Real terminal"
          echo

          exec /bin/toybox sh
          EOF
          chmod +x rootfs/init

          (cd rootfs && find . | cpio -o -H newc | gzip > ../initramfs.cpio.gz)

      - name: Build bootable ISO
        run: |
          mkdir -p iso/boot/grub
          cp arch/x86/boot/bzImage iso/boot/vmlinuz
          cp initramfs.cpio.gz iso/boot/

          cat > iso/boot/grub/grub.cfg <<EOF
          menuentry "Toybox Linux – Tiny, Modern, Works Everywhere" {
              linux  /boot/vmlinuz console=ttyS0 quiet
              initrd /boot/initramfs.cpio.gz
          }
          EOF

          grub-mkrescue -o Toybox-Linux.iso iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Toybox-Linux.iso
          path: Toybox-Linux.iso
