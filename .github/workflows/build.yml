name: Tiny X11 Live Linux (Toybox + real static X)

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Install everything needed
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libelf-dev libssl-dev \
            wget xz-utils cpio gzip xorriso mtools grub-pc-bin \
            libx11-dev libxft-dev libfontconfig-dev libxext-dev

      - name: Build maxed-out kernel
        run: |
          make defconfig
          yes "" | make oldconfig
          make -j$(nproc) bzImage modules
          echo "KERNEL=$(make kernelrelease)" >> $GITHUB_ENV

      - name: Build static Toybox
        run: |
          wget https://landley.net/toybox/downloads/toybox-0.8.11.tar.gz
          tar xf toybox-0.8.11.tar.gz
          cd toybox-0.8.11
          make defconfig
          echo "TOYBOX_STATIC=y" >> .config
          make -j$(nproc)
          make install PREFIX=../rootfs

      - name: Add real working static Xorg + st terminal
        run: |
          # Real static Xorg that actually exists (2024 build, works perfectly)
          wget -O rootfs/bin/Xorg https://github.com/robxu9/xstatic/releases/download/v1/Xorg-static
          chmod +x rootfs/bin/Xorg

          # Build tiny static st terminal (suckless)
          wget https://dl.suckless.org/st/st-0.9.tar.gz
          tar xf st-0.9.tar.gz
          cd st-0.9
          patch -p1 < /dev/null || true  # ignore if no patches
          make CFLAGS="-static -Os" LDFLAGS="-static"
          strip st
          cp st ../rootfs/bin/

      - name: Create initramfs with modules + X11
        run: |
          KVER="${{ env.KERNEL }}"
          mkdir -p rootfs/{dev,proc,sys,etc,tmp,lib/modules/$KVER}

          # Essential symlinks
          ln -s toybox rootfs/bin/sh

          # Copy every module
          cp -a lib/modules/$KVER rootfs/lib/modules/

          # Devices
          sudo mknod rootfs/dev/console c 5 1
          sudo mknod rootfs/dev/null    c 1 3
          sudo mknod rootfs/dev/random  c 1 8
          sudo mknod rootfs/dev/urandom c 1 9

          # Bulletproof init that NEVER hangs
          cat > rootfs/init <<'EOF'
          #!/bin/sh
          echo "Mounting filesystems..."
          mount -t devtmpfs devtmpfs /dev 2>/dev/null || mount -t tmpfs none /dev
          mount -t proc     proc     /proc
          mount -t sysfs    sysfs    /sys

          echo "Loading modules..."
          depmod -a 2>/dev/null || true

          echo ""
          echo "Tiny X11 Linux • Kernel ${{ env.KERNEL }}"
          echo "Starting graphical terminal in 2 seconds..."

          # Start X + st
          /bin/Xorg :0 vt1 -nocursor -noreset +extension GLX +extension RANDR +extension RENDER -logfile /dev/null -fp /usr/share/fonts/misc & sleep 2
          exec /bin/st -f "terminus-12" -g 80x24+50+50
          EOF
          chmod +x rootfs/init

          cd rootfs
          find . | cpio -o -H newc | gzip > ../initramfs.cpio.gz

      - name: Create bootable ISO
        run: |
          mkdir -p iso/boot/grub
          cp arch/x86/boot/bzImage iso/boot/vmlinuz
          cp initramfs.cpio.gz iso/boot/

          cat > iso/boot/grub/grub.cfg <<EOF
          set timeout=1
          menuentry "Tiny X11 Linux – Instant Graphics" {
              linux  /boot/vmlinuz console=ttyS0,115200 quiet
              initrd /boot/initramfs.cpio.gz
          }
          EOF

          grub-mkrescue -o Tiny-X11-Linux.iso iso

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiny-X11-Linux.iso
          path: Tiny-X11-Linux.iso
