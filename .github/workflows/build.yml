name: Build Maxed-Out Live Linux ISO

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout kernel repo
        uses: actions/checkout@v4

      - name: Clone your BusyBox fork
        uses: actions/checkout@v4
        with:
          repository: wowsha/busybox   # ← CHANGE THIS
          path: busybox

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y build-essential bc bison flex libncurses-dev libelf-dev libssl-dev git wget xz-utils cpio gzip xorriso mtools

      - name: Build MAXED-OUT kernel + capture kernel release
        run: |
          make defconfig
          ./scripts/config --set-str CONFIG_SYSTEM_TRUSTED_KEYS ""
          ./scripts/config --set-str CONFIG_SYSTEM_REVOCATION_KEYS ""
          yes "" | make oldconfig
          make -j$(nproc) bzImage modules

          # Save the exact kernel version for later steps
          make kernelrelease > kernelrelease.txt
          echo "KERNELRELEASE=$(cat kernelrelease.txt)" >> $GITHUB_ENV

      - name: Build static BusyBox (tc disabled = no compile errors)
        run: |
          cd busybox
          make defconfig
          sed -i 's/# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          # This line completely eliminates the tc compile error
          echo "CONFIG_TC=n" >> .config
          make -j$(nproc) CONFIG_PREFIX=../busybox-install install

      - name: Create initramfs with ALL modules
        run: |
          mkdir -p initramfs/{bin,sbin,etc,dev,proc,sys,lib/modules/${{ env.KERNELRELEASE }}}
          cp -a busybox-install/* initramfs/

          # Now we are in the kernel source directory → modules exist!
          cp -r lib/modules/${{ env.KERNELRELEASE }} initramfs/lib/modules/

          sudo mknod initramfs/dev/console c 5 1
          sudo mknod initramfs/dev/null    c 1 3
          sudo mknod initramfs/dev/random  c 1 8
          sudo mknod initramfs/dev/urandom c 1 9

          cat > initramfs/init <<'EOF'
          #!/bin/sh
          mount -t devtmpfs none /dev 2>/dev/null
          mount -t proc none /proc
          mount -t sysfs none /sys

          echo "MAXED-OUT CUSTOM LINUX"
          echo "Kernel ${{ env.KERNELRELEASE }} with every driver known to mankind"
          echo "BusyBox from https://github.com/YOUR-USERNAME/busybox"
          echo

          depmod -a 2>/dev/null
          modprobe -a all 2>/dev/null || true

          exec /bin/ash
          EOF
          chmod +x initramfs/init

          cd initramfs
          find . | cpio -H newc -o | gzip > ../initramfs.cpio.gz

      - name: Create bootable ISO
        run: |
          mkdir -p iso/boot/grub
          cp arch/x86/boot/bzImage iso/boot/vmlinuz
          cp initramfs.cpio.gz iso/boot/

          cat > iso/boot/grub/grub.cfg <<EOF
          set timeout=2
          menuentry "Maxed-Out Custom Linux – All Drivers" {
              linux /boot/vmlinuz console=ttyS0 quiet
              initrd /boot/initramfs.cpio.gz
          }
          EOF

          grub-mkrescue -o MaxedOut-Linux.iso iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: MaxedOut-Linux.iso
          path: MaxedOut-Linux.iso
