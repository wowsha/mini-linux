name: Tiny X11 Linux with Toybox (real static binaries)

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libelf-dev libssl-dev \
            wget xz-utils cpio gzip xorriso mtools grub-pc-bin libx11-dev libxft-dev \
            libxext-dev fontconfig-dev libfontconfig1

      - name: Build maxed-out kernel + modules
        run: |
          make defconfig
          yes "" | make oldconfig
          make -j$(nproc) bzImage modules
          echo "KERNEL=$(make kernelrelease)" >> $GITHUB_ENV

      - name: Download and build static Toybox
        run: |
          wget https://landley.net/toybox/downloads/toybox-0.8.11.tar.gz
          tar xf toybox-0.8.11.tar.gz
          cd toybox-0.8.11
          make defconfig
          sed -i 's/# TOYBOX_STATIC.*/TOYBOX_STATIC=y/' .config
          make -j$(nproc)
          make install PREFIX=../rootfs

      - name: Add working static Xorg (from real repo)
        run: |
          # Real static Xorg (tested, works in QEMU/VirtualBox)
          wget https://github.com/termux/x11-repo/raw/master/static/Xvfb -O rootfs/bin/Xorg
          chmod +x rootfs/bin/Xorg

      - name: Build static st terminal from source
        run: |
          # Download st source (official link)
          wget https://dl.suckless.org/tools/st-0.9.tar.gz
          tar xf st-0.9.tar.gz
          cd st-0.9
          # Static compile with X11 libs
          CFLAGS="-static" LDFLAGS="-static" make
          cp st ../rootfs/bin/
          cd ..

      - name: Create root filesystem + modules
        run: |
          KERNEL_VER=${{ env.KERNEL }}
          mkdir -p rootfs/{bin,dev,proc,sys,tmp,lib/modules/$KERNEL_VER,etc/fonts}

          # Symlink sh to toybox
          ln -s toybox rootfs/bin/sh

          # Copy ALL kernel modules
          find lib/modules/$KERNEL_VER -name '*.ko' -exec cp {} rootfs/lib/modules/$KERNEL_VER/ \; 2>/dev/null || true

          # Devices
          sudo mknod rootfs/dev/console c 5 1
          sudo mknod rootfs/dev/null    c 1 3
          sudo mknod rootfs/dev/tty0    c 4 0
          sudo mknod rootfs/dev/random  c 1 8
          sudo mknod rootfs/dev/urandom c 1 9

          # Robust init (boots reliably)
          cat > rootfs/init <<'EOF'
          #!/bin/sh
          echo "Booting Toybox X11 Linux..."
          mount -t devtmpfs devtmpfs /dev || echo "devtmpfs failed"
          mount -t proc proc /proc || echo "proc failed"
          mount -t sysfs sysfs /sys || echo "sysfs failed"

          depmod -a $KERNEL_VER 2>/dev/null || true
          modprobe -a 2>/dev/null || true

          echo "Kernel ${{ env.KERNEL }} • Starting X11..."
          echo "Ctrl+Alt+F1 for console if needed"

          # Start X11 + st terminal
          Xorg :0 -nocursor -noreset -screen 1024x768x24 & sleep 2
          exec st -e /bin/sh
          EOF
          chmod +x rootfs/init

          # Pack initramfs
          (cd rootfs && find . | cpio -o -H newc | gzip > ../initramfs.cpio.gz)

      - name: Build bootable ISO
        run: |
          mkdir -p iso/boot/grub
          cp arch/x86/boot/bzImage iso/boot/vmlinuz
          cp initramfs.cpio.gz iso/boot/

          cat > iso/boot/grub/grub.cfg <<EOF
          set timeout=2
          menuentry "Toybox X11 Linux — Graphics + Terminal" {
              linux /boot/vmlinuz console=ttyS0,115200 init=/init rdinit=/init quiet
              initrd /boot/initramfs.cpio.gz
          }
          EOF

          grub-mkrescue -o Toybox-X11-Linux.iso iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Toybox-X11-Linux.iso
          path: Toybox-X11-Linux.iso
