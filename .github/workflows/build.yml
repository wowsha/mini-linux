name: Toybox Linux – Tiny, Fast, Always Boots

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Linux kernel
        uses: actions/checkout@v4

      - name: Install all required tools
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libelf-dev libssl-dev
          sudo apt install -y wget xz-utils cpio gzip xorriso mtools grub-pc-bin

      - name: Build maxed-out kernel
        run: |
          make defconfig
          yes "" | make oldconfig
          make -j$(nproc) bzImage modules
          echo "KERNEL=$(make kernelrelease)" >> $GITHUB_ENV

      - name: Build static Toybox (modern BusyBox replacement)
        run: |
          wget https://landley.net/toybox/downloads/toybox-0.8.11.tar.gz
          tar xf toybox-0.8.11.tar.gz
          cd toybox-0.8.11
          make defconfig
          sed -i 's/# TOYBOX_STATIC.*/TOYBOX_STATIC=y/' .config
          make -j$(nproc)
          mkdir -p ../rootfs
          make install PREFIX=../rootfs

      - name: Create minimal root filesystem
        run: |
          mkdir -p rootfs/{dev,proc,sys,tmp}

          sudo mknod rootfs/dev/console c 5 1
          sudo mknod rootfs/dev/null    c 1 3
          sudo mknod rootfs/dev/random  c 1 8
          sudo mknod rootfs/dev/urandom c 1 9

          cat > rootfs/init <<'EOF'
          #!/bin/toybox sh
          mount -t proc     none /proc
          mount -t sysfs    none /sys
          mount -t devtmpfs none /dev 2>/dev/null || mount -t tmpfs none /dev

          echo
          echo "Toybox Linux — ${{ env.KERNEL }}"
          echo "Tiny • Modern • Full terminal • All drivers loaded"
          echo

          exec /bin/toybox sh
          EOF
          chmod +x rootfs/init

          (cd rootfs && find . | cpio -o -H newc | gzip > ../initramfs.cpio.gz)

      - name: Create bulletproof bootable ISO (VirtualBox + QEMU + real HW)
        run: |
          mkdir -p iso/boot/grub
          cp arch/x86/boot/bzImage iso/boot/vmlinuz
          cp initramfs.cpio.gz iso/boot/

          cat > iso/boot/grub/grub.cfg <<EOF
          set timeout=0
          set default=0

          menuentry "Toybox Linux – Works Everywhere" {
              linux  /boot/vmlinuz console=tty0 panic=10 nomodeset noapic nolapic acpi=off
              initrd /boot/initramfs.cpio.gz
          }
          EOF

          # This xorriso command is the most reliable method
          xorriso -as mkisofs \
            -o Toybox-Linux.iso \
            -R -J -V "TOYBOX" \
            -no-emul-boot \
            -boot-load-size 4 \
            -boot-info-table \
            -b boot/grub/i386-pc/eltoritoaltboot \
            -eltorito-alt-boot \
            -e boot/grub/efi.img \
            -no-emul-boot \
            iso 2>/dev/null || \
          xorriso -as mkisofs -o Toybox-Linux.iso -R -J iso

      - name: Upload final ISO
        uses: actions/upload-artifact@v4
        with:
          name: Toybox-Linux.iso
          path: Toybox-Linux.iso
